<!doctype html>
<html>

<head>
  <!-- 載入追蹤碼js -->
  <script>
    let cacheID = new Date().getMilliseconds();
    let Login_InternalScript = document.createElement('script');
    Login_InternalScript.src = `https://event.kgi.com.tw/news/event/commonResources/js/trackingCode_0515.js?uid=` + cacheID;
    document.head.appendChild(Login_InternalScript);
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff">
  <!-- 禁止使用者點擊兩下放大效果 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>凱基證券-每日晨訊</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="shortcut icon" href="images/favicon.ico" />
  <link href="https://www.kgi.com.tw/media/assets/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
  <link href="https://www.kgi.com.tw/media/assets/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
  <link href="https://www.kgi.com.tw/media/assets/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
</head>

<body>
  <main class="container">

    <!-- Loading 畫面 -->
    <div id="loading">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 50 50" class="loading-icon">
        <circle cx="25" cy="25" r="20" fill="none" stroke="#00367c" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="90,150" stroke-dashoffset="0" />
      </svg>
    </div>



    <!-- 凱基證券logo -->
    <div class="header">
      <div class="header-logo">
        <a href="https://www.kgi.com.tw/zh-tw/" title="凱基證券" target="_blank">
          <img src="https://eventtest.kgi.com.tw/news/event/commonResources/images/logo.svg" alt="凱基證券">
        </a>
      </div>
    </div>
    <div class="app-container">
      <div class="content-wrapper">
        <section class="survey-result">
          <div class="survey-title">
            <h1>最喜歡的證券APP功能</h1>
            <p>會員問卷結果</p>
          </div>

          <ol class="ranking-list">
            <li class="ranking-item">
              <span class="ranking-number">1</span>
              <img class="ranking-icon" src="images/rank.png" alt="">
              <span class="ranking-name">行情與評等</span>

              <span class="ranking-progress">
                <span class="ranking-bar"></span>
              </span>

              <strong class="ranking-value">38%</strong>
            </li>

            <li class="ranking-item">
              <span class="ranking-number">2</span>
              <img class="ranking-icon" src="images/web.png" alt="">
              <span class="ranking-name">自訂首頁</span>

              <span class="ranking-progress">
                <span class="ranking-bar"></span>
              </span>

              <strong class="ranking-value">29%</strong>
            </li>

            <li class="ranking-item">
              <span class="ranking-number">3</span>
              <img class="ranking-icon" src="images/target.png" alt="">
              <span class="ranking-name">策略選股</span>

              <span class="ranking-progress">
                <span class="ranking-bar"></span>
              </span>

              <strong class="ranking-value">21%</strong>
            </li>

            <li class="ranking-item">
              <span class="ranking-number">4</span>
              <img class="ranking-icon" src="images/schedule.png" alt="">
              <span class="ranking-name">我的行事曆</span>

              <span class="ranking-progress">
                <span class="ranking-bar"></span>
              </span>

              <strong class="ranking-value">12%</strong>
            </li>
          </ol>
        </section>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      window.addEventListener("load", function () {
        document.getElementById("loading").style.display = "none";
      });
    </script>
  </main>
</body>

</html>
